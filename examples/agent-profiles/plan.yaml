# Stage 1 — plan. Read the problem, argue about it, write the plan down.
#
# Its own profile, so the transcripts of "what we decided and why" never mix
# with the ones from the branch that implemented it.
version: "1"
name: plan

extends: ./base.yaml

runtimes:

  claude:
    variants:
      # The prompt is a PREFIX: what you type on the command line lands where
      # {} is, as ONE argument. claude takes a single trailing positional and
      # drops a second in silence, which is why appending cannot express this.
      brainstorm:
        - --effort=xhigh
        - "/superpowers:brainstorming {}"
      write:
        - --effort=xhigh
        - "/superpowers:writing-plans {}"
      opus:
        - --model=claude-opus-5
        - --effort=xhigh

  codex:
    variants:
      brainstorm:
        - "/superpowers:brainstorming {}"
      write:
        - "/superpowers:writing-plans {}"
