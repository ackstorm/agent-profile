version: "1"
name: execute

extends: ./spec-35-coding-base.yaml

targets:
  - claude
  - opencode

model:
  type: anthropic
  base_url: https://llm.company.com
  model: claude-opus-5[1m]

  auth:
    type: bearer
    value_from:
      secret: llm-token

  parameters:
    effort: high


prompt:
  mode: append
  content: |
    You are a coding agent.
    Implement changes carefully and keep the repository healthy.


inputs:

  secrets:

    llm-token:
      env: LITELLM_TOKEN

    memory-token:
      env: MEMORY_TOKEN

    gitlab-token:
      env: GITLAB_TOKEN


marketplaces:

  anthropic-skills:
    type: skills

    source:
      git:
        url: https://github.com/anthropics/skills.git
        ref: main
        subpath: skills

  acme-plugins:
    type: plugins

    source:
      git:
        url: https://gitlab.company.com/ai/agent-plugins.git
        ref: main

        auth:
          scheme: basic-oauth2
          value_from:
            secret: gitlab-token


skills:

  pdf:
    ref: pdf@anthropic-skills

  executing-plans:
    source:
      git:
        url: https://github.com/obra/superpowers.git
        ref: main
        subpath: skills/executing-plans

  company-review:
    source:
      git:
        url: https://gitlab.company.com/ai/skills.git
        ref: main
        subpath: review

        auth:
          value_from:
            secret: gitlab-token


mcps:

  memory:
    transport:
      type: http
      url: https://memory.company.com/mcp

      headers:
        Authorization:
          prefix: "Bearer "
          value_from:
            secret: memory-token


artifacts:

  agents-md:
    source:
      local:
        path: ./AGENTS.md

    destination: AGENTS.md


runtimes:

  claude:

    environment:
      COMPANY_PROFILE: execute

    variants:

      brainstorm:
        - --effort=xhigh
        - "/superpowers:brainstorming {}"

      opus:
        - --model=claude-opus-5
        - --effort=xhigh


  opencode:

    skills:

      company-review:
        enabled: false

    plugins:

      ponytail:
        package: "@dietrichgebert/ponytail"

    variants:

      brainstorm:
        - "/superpowers:brainstorming {}"
